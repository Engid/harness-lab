[project]
name = "harness-lab"
version = "0.0.1"
description = "A homemade agent harness on Jev, built one working rung at a time. Learning code."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typesafe-sdk>=0.7.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear
select = ["E", "F", "I", "UP", "B"]
